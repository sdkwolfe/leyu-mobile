name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Create .env
        run: |
          echo "API_BASE_URL=https://api.ydleyucomp.online/api" > .env
          echo "ONESIGNAL_APP_ID=dummy_onesignal_id" >> .env
          
      - name: Generate Android Keystore and key.properties
        run: |
          keytool -genkey -v -keystore android/app/release.keystore -alias leyu_key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Leyu, OU=App, O=Leyu, L=AddisAbaba, S=Addis, C=ET"
          cat << 'EOF' > android/key.properties
          storePassword=123456
          keyPassword=123456
          keyAlias=leyu_key
          storeFile=release.keystore
          EOF
          cp android/key.properties android/app/key.properties
          cp android/app/release.keystore android/release.keystore
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Patch legacy plugins for Gradle compatibility
        run: |
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.compileSdkVersion/34/g' {} +
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.minSdkVersion/21/g' {} +
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.targetSdkVersion/34/g' {} +
          
      - name: Update Gradle, AGP, and Kotlin versions
        run: |
          # 1. Update Gradle Wrapper (AGP 8.11 requires Gradle 8.13+)
          sed -i -E 's/gradle-[0-9.]+-(all|bin)\.zip/gradle-8.14-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          
          # 2. Update AGP (to 8.11.1) and Kotlin (to 2.2.20) in new template
          find android -maxdepth 1 -name "settings.gradle*" -exec sed -i -E 's/(com\.android\.application[^0-9]*)[0-9]+\.[0-9]+\.[0-9]+/\18.11.1/g' {} +
          find android -maxdepth 1 -name "settings.gradle*" -exec sed -i -E 's/(org\.jetbrains\.kotlin\.android[^0-9]*)[0-9]+\.[0-9]+\.[0-9]+/\12.2.20/g' {} +
          
          # 3. Update AGP and Kotlin in old template (android/build.gradle)
          if [ -f android/build.gradle ]; then
            sed -i -E 's/(com\.android\.tools\.build:gradle:)[0-9]+\.[0-9]+\.[0-9]+/\18.11.1/g' android/build.gradle
            sed -i -E "s/(ext\.kotlin_version\s*=\s*['\"])[0-9]+\.[0-9]+\.[0-9]+(['\"])/\12.2.20\2/g" android/build.gradle
          fi
          
          echo "--- Verification ---"
          cat android/gradle/wrapper/gradle-wrapper.properties
          grep -nE "com.android.application|org.jetbrains.kotlin.android" android/settings.gradle* 2>/dev/null || true
          grep -nE "com.android.tools.build:gradle|ext.kotlin_version" android/build.gradle 2>/dev/null || true
          
      - name: Build Release APK
        # Added the bypass flag to suppress the "will soon be dropped" warnings for Gradle/AGP
        run: flutter build apk --release --android-skip-build-dependency-validation
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: leyu-contributor-app
          path: build/app/outputs/flutter-apk/app-release.apk
